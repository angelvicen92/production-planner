name: P0 U00v native standalone operational scopes
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'server/**'
      - 'shared/**'
      - 'supabase/migrations/**'
      - 'client/src/**'
      - 'script/demo/**'
      - 'docs/evidence/p0-u00v/**'
      - '.github/workflows/p0-u00v-task-operation-scopes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-standalone-scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select Chromium
        run: |
          task_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_browser_path" ]; then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$task_browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run check && npm run check:migrations && npm run build
      - run: npx --no-install tsc -p docs/evidence/p0-u00v/tsconfig.json
      - run: npx --no-install tsx --test --test-concurrency=1 engine/planner-next/integration/nativeTaskOperationScopes.spec.ts engine/planner-next/integration/nativeAnchoredAccompaniment.spec.ts engine/planner-next/integration/effectiveTaskResourceAssignments.spec.ts server/dayConfiguration.spec.ts script/demo/assistedSQLContracts.spec.ts script/demo/a2Preflight.spec.ts
      - name: Populated historical upgrade and exact SQL bodies, readers and permissions
        run: node --import tsx docs/evidence/p0-u00v/upgrade117.ts work/u00v-upgrade
      - name: Two native UI days through proposals, Drafts, validation, Stages and redo
        run: node --import tsx docs/evidence/p0-u00v/run.ts work/u00v-native --native
      - name: Anchored U00u regression on the same product
        run: node --import tsx docs/evidence/p0-u00v/regressions.ts work/u00v-anchored anchored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u00v-native-standalone-scopes
          path: |
            work/u00v-upgrade/manifest.json
            work/u00v-upgrade/native/*.json
            work/u00v-upgrade/native/*.json.gz
            work/u00v-native/manifest.json
            work/u00v-native/checkout-delta.json
            work/u00v-native/native/*.json
            work/u00v-native/native/*.png
            work/u00v-anchored/manifest.json
            work/u00v-anchored/native/*.json
            work/u00v-anchored/native/*.png
          retention-days: 14
