name: A2-FULL-006 clean materialize

on:
  push:
    branches:
      - a2-full-006-clean-validator
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: a2-full-006-clean-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip a2-full-006]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: a2-full-006-clean-validator
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Materialize and validate candidate
        shell: bash
        run: |
          set -o pipefail
          LOG=/tmp/a2-full-006.log
          : > "$LOG"
          set +e
          {
            node <<'NODE'
            const fs = require('node:fs');
            const validatePath = 'engine/planner-next/benchmarks/focal-a2/full-day/validate.ts';
            let source = fs.readFileSync(validatePath, 'utf8');
            const oldText = 'if (!actual || actual.memberResourceIds.join(",") !== unit.memberResourceIds.join(",") || actual.availability !== "creation_input_required") issues.push(issue("ITINERANT_UNITS", "ITINERANT_UNIT_SET_INVALID", unit.id, "Itinerant unit composition must match SPEC-08."));';
            const newText = 'if (!actual || actual.memberResourceIds.join(",") !== unit.memberResourceIds.join(",") || actual.availability.start !== unit.availability.start || actual.availability.end !== unit.availability.end || actual.availability.source !== unit.availability.source) issues.push(issue("ITINERANT_UNITS", "ITINERANT_UNIT_SET_INVALID", unit.id, "Itinerant unit composition or availability must match SPEC-08."));';
            const count = source.split(oldText).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one stale itinerant assertion, found ${count}`);
            fs.writeFileSync(validatePath, source.replace(oldText, newText));

            const testPath = 'engine/planner-next/benchmarks/__tests__/fullA2ItinerantAvailabilityValidation.test.ts';
            fs.writeFileSync(testPath, `import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";
import {
  createCanonicalFullA2Template,
  expandCanonicalFullA2Template,
  validateExpandedCanonicalFullA2Template,
  type ExpandedCanonicalFullA2Template,
} from "../focal-a2/full-day/canonicalFullA2Template";

function cloneExpansion(): ExpandedCanonicalFullA2Template {
  return structuredClone(expandCanonicalFullA2Template(createCanonicalFullA2Template())) as ExpandedCanonicalFullA2Template;
}

function assertMutationFails(mutator: (unit: any) => void): void {
  const expansion: any = cloneExpansion();
  const unit = expansion.itinerantUnits.find((entry: any) => entry.id === "reality-unit-a");
  assert.ok(unit);
  mutator(unit);
  const validation = validateExpandedCanonicalFullA2Template(expansion);
  const invariant = validation.invariants.find((entry) => entry.code === "ITINERANT_UNITS");
  assert.equal(validation.status, "INVALID");
  assert.equal(invariant?.passed, false);
  assert.ok(invariant?.issueCodes.includes("ITINERANT_UNIT_SET_INVALID"));
}

test("canonical SPEC-08 itinerant windows remain canonically valid", () => {
  const validation = validateExpandedCanonicalFullA2Template(cloneExpansion());
  assert.equal(validation.status, "VALID", validation.issues.map((issue) => issue.code + ":" + issue.entityId).join("\\n"));
  assert.deepEqual(validation.issues, []);
  assert.equal(validation.invariants.find((entry) => entry.code === "ITINERANT_UNITS")?.passed, true);
});

test("itinerant validation rejects mutated start, end and source", () => {
  assertMutationFails((unit) => { unit.availability.start = "11:05"; });
  assertMutationFails((unit) => { unit.availability.end = "13:55"; });
  assertMutationFails((unit) => { unit.availability.source = "OTHER_SOURCE"; });
});

test("checked-in Full A2 Evidence declares the canonical template valid", () => {
  const evidence = JSON.parse(readFileSync("docs/evidence/SPEC10-016-full-a2-canonical-template.json", "utf8"));
  assert.equal(evidence.validationStatus, "VALID");
  assert.deepEqual(evidence.validationIssues, []);
  const itinerant = evidence.invariants.find((entry: any) => entry.code === "ITINERANT_UNITS");
  assert.equal(itinerant?.passed, true);
  assert.deepEqual(itinerant?.issueCodes, []);
});
`);

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');
            const heading = '## A2-FULL-006 — Validación canónica de disponibilidad itinerante';
            if (!readme.includes(heading)) {
              readme += `\n\n${heading}\n\n- **Objetivo (DB Safe Merge):** corregir la regresión de benchmark introducida al materializar las ventanas Reality de SPEC-08: el validador seguía esperando el sentinel histórico \`creation_input_required\`.\n- **Semántica:** la composición y disponibilidad de cada unidad itinerante se validan exactamente contra el contrato canónico estructurado (inicio, fin y procedencia), sin defaults ni uso del planning humano como seed.\n- **Gate reforzado:** Full A2 debe conservar \`validationStatus=VALID\`, cero \`validationIssues\`, \`ITINERANT_UNITS.passed=true\`, cero blockers técnicos y únicamente los tres inputs de producción todavía no configurados.\n- **Fuera de alcance:** no cambia Planner Next, presupuesto, DB/UI ni resuelve disponibilidad de participantes, comidas scoped o política OUT.\n`;
              fs.writeFileSync(readmePath, readme);
            }
            NODE

            echo '=== regenerate evidence before evidence-backed tests ==='
            npm run benchmark:planner-next:a2-full-template

            node <<'NODE'
            const fs = require('node:fs');
            const e = JSON.parse(fs.readFileSync('docs/evidence/SPEC10-016-full-a2-canonical-template.json', 'utf8'));
            const expected = ['daily_participant_availability', 'out_transport_policy', 'scoped_meal_policies'];
            const fail = (m) => { throw new Error(m); };
            if (e.validationStatus !== 'VALID') fail(`validationStatus=${e.validationStatus}`);
            if (!Array.isArray(e.validationIssues) || e.validationIssues.length !== 0) fail('validationIssues must be empty');
            const itinerant = e.invariants?.find((x) => x.code === 'ITINERANT_UNITS');
            if (!itinerant?.passed || (itinerant.issueCodes?.length ?? 0) !== 0) fail('ITINERANT_UNITS must pass cleanly');
            if (JSON.stringify(e.requiredCreationInputs) !== JSON.stringify(expected)) fail(`requiredCreationInputs=${JSON.stringify(e.requiredCreationInputs)}`);
            if ((e.implementationBlockers?.length ?? -1) !== 0) fail('implementationBlockers must be empty');
            if (e.nextImplementationBlocker !== null) fail('nextImplementationBlocker must be null');
            if (e.roundSynchronizationCapabilityProven !== true) fail('roundSynchronizationCapabilityProven regressed');
            if (e.representabilityStatus !== 'BLOCKED') fail(`representabilityStatus=${e.representabilityStatus}`);
            NODE

            echo '=== focused regression tests ==='
            npx tsx --test \
              engine/planner-next/benchmarks/__tests__/fullA2CanonicalTemplate.test.ts \
              engine/planner-next/benchmarks/__tests__/fullA2ItinerantAvailabilityValidation.test.ts

            echo '=== remove temporary tooling and verify scope ==='
            rm -f .github/workflows/a2-full-006-clean-materialize.yml .github/A2_FULL_006_FAILURE.log

            mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
            printf '%s\n' "${changed[@]}"
            allowed_re='^(README\.md|engine/planner-next/benchmarks/focal-a2/full-day/validate\.ts|engine/planner-next/benchmarks/__tests__/fullA2ItinerantAvailabilityValidation\.test\.ts|docs/evidence/SPEC10-016-full-a2-canonical-template\.json|docs/coverage/SPEC10-016-FULL-A2-TEMPLATE\.md|\.github/workflows/a2-full-006-clean-materialize\.yml)$'
            for f in "${changed[@]}"; do
              [[ "$f" =~ $allowed_re ]] || { echo "Unexpected changed file: $f"; exit 1; }
            done

            git add -A
            git diff --cached --check
            git config user.name 'OptiPlan Automation'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m '[skip a2-full-006] A2-FULL-006: corregir validación de ventanas itinerantes'

            echo '=== exact DB Safe Merge gate ==='
            npm run check:migrations
            npm run check
            npm test
            npm run build
            npm run benchmark:planner-next:a2-full-template
            git diff --exit-code
            git diff --check origin/main...HEAD
            test -z "$(git status --porcelain)"
          } 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 ]]; then
            echo "A2-FULL-006 failed with status $status"
            git reset --hard origin/a2-full-006-clean-validator
            cp "$LOG" .github/A2_FULL_006_FAILURE.log
            git add .github/A2_FULL_006_FAILURE.log
            git config user.name 'OptiPlan Automation'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m '[skip a2-full-006] diagnostic: A2-FULL-006 clean materializer failure'
            git push origin HEAD:a2-full-006-clean-validator
            exit $status
          fi

          git push origin HEAD:a2-full-006-clean-validator
          echo "A2-FULL-006 candidate published at $(git rev-parse HEAD)"
