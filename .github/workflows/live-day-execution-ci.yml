name: Live day execution

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/liveExecution*'
      - 'server/executionTimeCorrections*'
      - 'client/src/lib/api.ts'
      - 'client/src/lib/execution-precondition*'
      - 'client/src/lib/execution-time-correction*'
      - 'client/src/lib/my-day-operational*'
      - 'client/src/components/my-day/**'
      - 'script/demo/smokeExecutionTimeCorrections.ts'
      - 'server/incidents*'
      - 'server/fixtures/executionDatabase.ts'
      - 'server/apiAuthorization*'
      - 'server/routes.ts'
      - 'server/storage.ts'
      - 'shared/execution.ts'
      - 'shared/routes.ts'
      - 'client/src/components/day-workspace/day-execution-workspace.tsx'
      - 'client/src/pages/plan-details.tsx'
      - 'client/src/pages/my-day.tsx'
      - 'client/src/pages/dashboard.tsx'
      - 'client/src/pages/control-room.tsx'
      - 'client/src/hooks/use-plan-realtime.ts'
      - 'client/src/hooks/use-execution-context.ts'
      - 'client/src/hooks/use-tasks.ts'
      - 'client/src/hooks/usePlanOpsData.ts'
      - 'client/src/components/production-control-panel.tsx'
      - 'supabase/migrations/**'
      - 'script/demo/smoke*Execution*'
      - 'script/demo/smokeProductionScopeJourney.ts'
      - 'script/demo/smokeA2Integration.ts'
      - '.github/workflows/live-day-execution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-day-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-day-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --import tsx --test --test-concurrency=1 server/liveExecution.spec.ts server/executionTimeCorrections.spec.ts client/src/lib/execution-precondition.test.ts server/incidents.spec.ts server/apiAuthorization.spec.ts server/assistedPlanningWorkflow.spec.ts
      - run: node --import tsx --test client/src/lib/execution-time-correction.test.ts client/src/lib/my-day-temporal.test.ts
      - run: node --import tsx --test client/src/lib/my-day-operational.test.ts client/src/components/my-day/activity-information.test.tsx
      - name: Nominal Production authority, incidents and accepted A2 preservation
        run: node --import tsx script/demo/smokeA2Integration.ts work/production-scope --historical-topology --production-scope
      - run: npx --no-install playwright install --with-deps chromium
      - name: Mi Día correction form, errors, Madrid DST and mobile/tablet
        run: node client/src/components/my-day/p3.browser.mjs
      - name: Mi Día simultaneous matrix, real filters, scope and mobile/tablet
        run: node client/src/components/my-day/p4.browser.mjs
      - name: Audited time corrections, concurrency, G0 and existing read views
        run: node --import tsx script/demo/smokeA2Integration.ts work/time-corrections --historical-topology --time-corrections
      - name: Accepted snapshot, native ledger, real Auth/HTTP and two browsers
        run: node --import tsx script/demo/smokeA2Integration.ts work/live-day-execution --historical-topology --live-execution-snapshot
      - name: Public execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-day-execution
          path: |
            work/time-corrections/integration.json
            work/time-corrections/p2b-*.png
            work/time-corrections/p3-*.png
            work/p3-browser/browser.json
            work/p3-browser/*.png
            work/p4-browser/browser.json
            work/p4-browser/*.png
            work/production-scope/integration.json
            work/live-day-execution/integration.json
            work/live-day-execution/mi-dia-*.png
            work/live-day-execution/workspace-*.png
