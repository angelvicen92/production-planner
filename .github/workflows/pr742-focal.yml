name: PR 742 Focal Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test engine/planner-next/exactItinerantPlan.spec.ts engine/planner-next/jointTasks.spec.ts
