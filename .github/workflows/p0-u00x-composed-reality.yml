name: P0 U00x composed native Reality
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'server/**'
      - 'shared/**'
      - 'client/src/**'
      - 'supabase/migrations/**'
      - 'script/demo/**'
      - 'docs/evidence/p0-u00x/**'
      - '.github/workflows/p0-u00x-composed-reality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composed-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select Chromium
        run: |
          task_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_browser_path" ]; then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$task_browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run check && npm run check:migrations && npm run build
      - run: npx --no-install tsc -p docs/evidence/p0-u00x/tsconfig.json
      - run: node --import tsx --test --test-concurrency=1 engine/planner-next/integration/nativeRealityComposition.spec.ts engine/planner-next/integration/nativeAnchoredChoice.spec.ts engine/planner-next/integration/nativeAnchoredAccompaniment.spec.ts script/demo/assistedSQLContracts.spec.ts script/demo/a2Preflight.spec.ts
      - run: node --import tsx docs/evidence/p0-u00x/upgrade119.ts work/u00x-upgrade
      - run: node --import tsx docs/evidence/p0-u00x/run.ts work/u00x-native --native
      - run: node --import tsx docs/evidence/p0-u00x/run.ts work/u00x-repeat --native
      - run: node --import tsx docs/evidence/p0-u00x/verify.ts work/u00x-native work/u00x-repeat work/u00x-determinism.json
      - run: node --import tsx docs/evidence/p0-u00x/run.ts work/u00x-shared --native --shared-negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u00x-composed-reality
          path: |
            work/u00x-upgrade/manifest.json
            work/u00x-upgrade/native/*.json
            work/u00x-upgrade/native/*.json.gz
            work/u00x-native/manifest.json
            work/u00x-native/checkout-delta.json
            work/u00x-native/native/*.json
            work/u00x-native/native/*.png
            work/u00x-repeat/manifest.json
            work/u00x-repeat/native/*.json
            work/u00x-shared/manifest.json
            work/u00x-shared/native/*.json
            work/u00x-determinism.json
          retention-days: 14
