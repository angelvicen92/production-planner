name: P0 U00y native joint operations
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'server/**'
      - 'shared/**'
      - 'client/src/**'
      - 'supabase/migrations/**'
      - 'script/demo/**'
      - 'docs/evidence/p0-u00y/**'
      - '.github/workflows/p0-u00y-native-joint-operations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-joint-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select Chromium
        run: |
          task_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_browser_path" ]; then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$task_browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run check && npm run check:migrations && npm run build
      - run: npx --no-install tsc -p docs/evidence/p0-u00y/tsconfig.json
      - run: node --import tsx --test --test-concurrency=1 engine/planner-next/integration/nativeJointGroups.spec.ts engine/planner-next/jointTasks.spec.ts engine/planner-next/integration/nativeRealityComposition.spec.ts script/demo/assistedSQLContracts.spec.ts script/demo/a2Preflight.spec.ts
      - run: node --import tsx docs/evidence/p0-u00y/upgrade120.ts work/u00y-upgrade
      - run: node --import tsx docs/evidence/p0-u00y/run.ts work/u00y-native --native
      - run: node --import tsx docs/evidence/p0-u00y/run.ts work/u00y-repeat --native
      - run: node --import tsx docs/evidence/p0-u00y/verify.ts work/u00y-native work/u00y-repeat work/u00y-determinism.json
      - run: node --import tsx docs/evidence/p0-u00y/physical.ts work/u00y-native work/u00y-physical.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u00y-native-joint-operations
          path: |
            work/u00y-upgrade/manifest.json
            work/u00y-upgrade/native/*.json
            work/u00y-upgrade/native/*.json.gz
            work/u00y-native/manifest.json
            work/u00y-native/checkout-delta.json
            work/u00y-native/native/*.json
            work/u00y-native/native/*.png
            work/u00y-repeat/manifest.json
            work/u00y-repeat/native/*.json
            work/u00y-physical.json
            work/u00y-determinism.json
          retention-days: 14
