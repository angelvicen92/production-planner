name: Baseline CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-ci:
    name: baseline-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Migration sequence check
        run: npm run check:migrations

      - name: Production build
        run: npm run build

      - name: Materialize and publish validated SPEC10-021 candidate
        if: github.ref == 'refs/heads/automation/spec10-021-ci-publisher' || github.head_ref == 'automation/spec10-021-ci-publisher'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/spec10-021-replit-gate spec10-021-round-sync-candidate tooling/spec10-021-totales-round-sync
          git show origin/automation/spec10-021-replit-gate:scripts/materialize-validate-spec10-021-v3.sh | bash
