name: PR 742 Full A2 Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Full A2 exact execution once
        run: node --import tsx engine/planner-next/benchmarks/runFullA2FirstExecutionBenchmark.ts | tee /tmp/full-a2-exec.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr742-full-a2-exec
          path: |
            /tmp/full-a2-exec.txt
            docs/evidence/A2-FULL-EXEC-001-first-execution.json
