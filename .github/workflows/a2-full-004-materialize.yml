name: Materialize A2-FULL-004 source configuration

on:
  pull_request:
    branches:
      - a2-full-004-source-configuration-contract

permissions:
  contents: write

jobs:
  materialize:
    if: startsWith(github.head_ref, 'automation/a2-full-004-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: a2-full-004-source-configuration-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply source configuration contract
        shell: bash
        run: |
          set -euo pipefail
          cat > engine/planner-next/benchmarks/focal-a2/full-day/benchmarkConfiguration.ts <<'EOF'
          export const A2_BENCHMARK_SOURCE_CONFIGURATION = Object.freeze({
            version: "A2-FULL-004.source-configuration.v1" as const,
            executionDate: "2025-06-15" as const,
            effectiveDayWindow: Object.freeze({
              start: "09:00" as const,
              end: "21:00" as const,
              source: "PRD_DAY_SETUP_DEFAULT" as const,
            }),
            spaceAvailability: "INHERIT_CONTAINER_OR_DAY_UNLESS_OVERRIDDEN" as const,
            resourceAvailability: "INHERIT_DAY_UNLESS_OVERRIDDEN" as const,
            productiveIds: "DERIVE_FROM_CANONICAL_IDENTITIES" as const,
            unresolvedCreationInputs: Object.freeze([
              "daily_participant_availability",
              "daily_itinerant_unit_availability",
              "scoped_meal_policies",
              "out_transport_policy",
            ] as const),
          });

          export type A2BenchmarkUnresolvedCreationInput =
            typeof A2_BENCHMARK_SOURCE_CONFIGURATION.unresolvedCreationInputs[number];
          EOF

          cat > engine/planner-next/benchmarks/focal-a2/full-day/benchmarkConfiguration.spec.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { A2_BENCHMARK_SOURCE_CONFIGURATION } from "./benchmarkConfiguration";
          import { createCanonicalFullA2Template } from "./manifest";

          test("A2 source configuration resolves only source/default/derived values and leaves four real decisions fail-closed", () => {
            const config = A2_BENCHMARK_SOURCE_CONFIGURATION;
            assert.equal(config.executionDate, "2025-06-15");
            assert.deepEqual(config.effectiveDayWindow, {
              start: "09:00",
              end: "21:00",
              source: "PRD_DAY_SETUP_DEFAULT",
            });
            assert.equal(config.spaceAvailability, "INHERIT_CONTAINER_OR_DAY_UNLESS_OVERRIDDEN");
            assert.equal(config.resourceAvailability, "INHERIT_DAY_UNLESS_OVERRIDDEN");
            assert.equal(config.productiveIds, "DERIVE_FROM_CANONICAL_IDENTITIES");
            assert.deepEqual(config.unresolvedCreationInputs, [
              "daily_participant_availability",
              "daily_itinerant_unit_availability",
              "scoped_meal_policies",
              "out_transport_policy",
            ]);
            assert.deepEqual(createCanonicalFullA2Template().requiredCreationInputs, config.unresolvedCreationInputs);
          });

          test("A2 resolved source configuration contains no human schedule ordering or task timing", () => {
            const serialized = JSON.stringify(A2_BENCHMARK_SOURCE_CONFIGURATION);
            for (const forbidden of [
              "referenceOrder", "startPlanned", "endPlanned", "11:15", "17:15", "18:35",
              "Cristina", "Julio", "José Javier",
            ]) assert.equal(serialized.includes(forbidden), false, forbidden);
          });
          EOF

          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");

          const manifestPath = "engine/planner-next/benchmarks/focal-a2/full-day/manifest.ts";
          let manifest = fs.readFileSync(manifestPath, "utf8");
          const typeImport = 'import { CONTRACT_VERSION, PARTICIPANT_IDS } from "./types";';
          if (!manifest.includes(typeImport)) throw new Error("A2-FULL-004: manifest type import not found");
          manifest = manifest.replace(typeImport, `${typeImport}\nimport { A2_BENCHMARK_SOURCE_CONFIGURATION } from "./benchmarkConfiguration";`);

          const resourcesStart = manifest.indexOf("export const CANONICAL_RESOURCES");
          const unitsStart = manifest.indexOf("export const CANONICAL_ITINERANT_UNITS");
          if (resourcesStart < 0 || unitsStart <= resourcesStart) throw new Error("A2-FULL-004: resource block not found");
          const resources = manifest.slice(resourcesStart, unitsStart);
          const resourceMatches = resources.match(/availability: "creation_input_required"/g) ?? [];
          if (resourceMatches.length !== 8) throw new Error(`A2-FULL-004: expected 8 canonical resource availability markers, got ${resourceMatches.length}`);
          manifest = manifest.slice(0, resourcesStart)
            + resources.replaceAll('availability: "creation_input_required"', 'availability: "inherits_day_unless_overridden"')
            + manifest.slice(unitsStart);

          const oldInputs = `    requiredCreationInputs: [\n      "daily_participant_availability",\n      "daily_resource_availability",\n      "daily_space_availability",\n      "daily_itinerant_unit_availability",\n      "effective_day_window",\n      "execution_date",\n      "future_productive_ids",\n      "general_meal_window",\n      "out_transport_policy",\n    ],`;
          if (!manifest.includes(oldInputs)) throw new Error("A2-FULL-004: historical requiredCreationInputs block not found");
          manifest = manifest.replace(oldInputs, "    requiredCreationInputs: A2_BENCHMARK_SOURCE_CONFIGURATION.unresolvedCreationInputs,");
          fs.writeFileSync(manifestPath, manifest);

          const typesPath = "engine/planner-next/benchmarks/focal-a2/full-day/types.ts";
          let types = fs.readFileSync(typesPath, "utf8");
          types = types.replace(
            'export const CONTRACT_VERSION = "SPEC10-016.full-a2-template.v2";',
            'export const CONTRACT_VERSION = "SPEC10-016.full-a2-template.v3";',
          );
          const oldResourceType = 'readonly availability: "creation_input_required";\n}\n\nexport interface AnchoredOperationContract';
          if (!types.includes(oldResourceType)) throw new Error("A2-FULL-004: CanonicalResource availability type not found");
          types = types.replace(
            oldResourceType,
            'readonly availability: "inherits_day_unless_overridden";\n}\n\nexport interface AnchoredOperationContract',
          );
          fs.writeFileSync(typesPath, types);
          NODE
      - name: Focused validation and Evidence
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test engine/planner-next/benchmarks/focal-a2/full-day/benchmarkConfiguration.spec.ts
          npm run benchmark:planner-next:a2-full-template
          npm run check
          git diff --check
      - name: Document checkpoint and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## A2-FULL-004 — Contrato de configuración fuente$' README.md; then
            cat >> README.md <<'EOF'

          ## A2-FULL-004 — Contrato de configuración fuente

          - Full A2 deja de exigir como decisiones humanas la fecha, la ventana base del día, las ventanas explícitas de cada espacio/recurso y los IDs productivos cuando esos valores están definidos, heredados o son derivables por contrato oficial.
          - La configuración fuente versionada conserva cuatro decisiones fail-closed: disponibilidad de concursantes, disponibilidad de unidades itinerantes, comidas scoped adicionales y política OUT.
          - Los recursos canónicos sin override heredan la jornada; las unidades itinerantes mantienen disponibilidad explícita obligatoria conforme a SPEC-08.
          - No se usan horas del planning humano como seed, disponibilidad, lock ni hint de búsqueda.
          EOF
          fi
          rm -f .github/workflows/a2-full-004-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name "OptiPlan Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "A2-FULL-004: alinear configuración fuente del benchmark"
          git push origin HEAD:a2-full-004-source-configuration-contract
