name: Validate SPEC11 hard resource inputs final

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'spec11-engine-input-hard-resource-loads'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Targeted source-criticality regression
        run: npx tsx --test engine/buildInput.sourceCriticality.spec.ts
      - name: Full test suite
        run: npm test
      - name: EngineInput adapter benchmark
        run: npm run benchmark:planner-next:engine-input-adapter
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
