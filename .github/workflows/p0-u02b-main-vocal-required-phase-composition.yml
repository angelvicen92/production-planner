name: P0 U02b Main Vocal REQUIRED phase composition
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'server/**'
      - 'shared/**'
      - 'client/src/**'
      - 'supabase/migrations/**'
      - 'script/demo/**'
      - 'docs/evidence/p0-u02b/**'
      - '.github/workflows/p0-u02b-fixed-itinerant-phase-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  required-phase-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select Chromium
        run: |
          task_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_browser_path" ]; then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$task_browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run check && npm run check:migrations && npm run build
      - run: npx --no-install tsc -p docs/evidence/p0-u02b/tsconfig.json
      - run: >-
          node --import tsx --test --test-concurrency=1
          server/fixedItinerantPhaseComposition.spec.ts server/requiredPhaseComposition.spec.ts server/technicalChainStructure.spec.ts server/technicalChainSql.spec.ts
          server/assistedScopeResolver.spec.ts server/assistedNextScope.spec.ts server/assistedProposalService.spec.ts
          server/assistedPlanningWorkflow.spec.ts server/dayConfiguration.spec.ts server/apiAuthorization.spec.ts
          engine/planner-next/planMainFlowAndFeeders.spec.ts engine/planner-next/technicalChains.spec.ts engine/planner-next/operationContinuity.spec.ts engine/planner-next/jointTasks.spec.ts
          engine/planner-next/integration/nativeJointGroups.spec.ts engine/planner-next/integration/nativeOperationalMeals.spec.ts
          engine/planner-next/integration/nativeRealityComposition.spec.ts script/demo/assistedSQLContracts.spec.ts script/demo/a2Preflight.spec.ts
      - run: node --import tsx docs/evidence/p0-u02b/upgrade125.ts work/u02b-upgrade
      - run: node --import tsx docs/evidence/p0-u02b/run.ts work/u02b-native
      - run: node --import tsx docs/evidence/p0-u02b/run.ts work/u02b-repeat
      - run: python3 docs/evidence/p0-u02b/verify.py work/u02b-native/native work/u02b-repeat/native work/u02b-verification.json
      - name: Preserve native Main Vocal authoring
        run: node --import tsx docs/evidence/p0-u02b/control.ts work/u02b-u00a p0-u00a
      - name: Imported A2 regression, separate from native authoring
        run: node --import tsx docs/evidence/p0-u00n/a2.ts work/u02b-a2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u02b-required-phase-composition
          path: |
            work/u02b-u00a/native/*.json
            work/u02b-upgrade/manifest.json
            work/u02b-upgrade/native/*.json
            work/u02b-upgrade/native/*.json.gz
            work/u02b-native/manifest.json
            work/u02b-native/native/*.json
            work/u02b-native/native/*.png
            work/u02b-repeat/manifest.json
            work/u02b-repeat/native/*.json
            work/u02b-verification.json
            work/u02b-a2/*
          retention-days: 14
