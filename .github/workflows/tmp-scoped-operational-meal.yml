name: Temporary scoped operational meal implementation

on:
  push:
    branches: [optiplan/scoped-operational-meal-exclusivity]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optiplan/scoped-operational-meal-exclusivity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp-scoped-operational-meal.py')
          text = path.read_text()
          text = text.replace("'''  return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals };'''", "'''return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals };'''")
          text = text.replace("'''  return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals, operationalMeals: foundOperationalMeals };'''", "'''return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals, operationalMeals: foundOperationalMeals };'''")
          path.write_text(text)
          PY
          python .github/tmp-scoped-operational-meal.py
          echo '  b2socHJlZmxpZ2h0LnJlYXNvbkNvZGVzLmluY2x1ZGVzKCJVTlNVUFBPUlRFRF9PUEVSQVRJT05BTF9NRUFMX1BPTElDWSIpKTsKfSk7Cg==' | tr -d ' ' | base64 -d > engine/planner-next/flexibleOperationalMealPolicy.spec.ts
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Focal tests
        run: npx tsx --test engine/planner-next/flexibleOperationalMealPolicy.spec.ts engine/planner-next/spaceMeals.spec.ts engine/planner-next/exactFlexibleSetupOrder.spec.ts
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/tmp-scoped-operational-meal.py .github/workflows/tmp-scoped-operational-meal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement scoped operational meal exclusivity'
          git push origin HEAD:optiplan/scoped-operational-meal-exclusivity
