name: Temporary scoped operational meal implementation

on:
  push:
    branches: [optiplan/scoped-operational-meal-exclusivity]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optiplan/scoped-operational-meal-exclusivity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp-scoped-operational-meal.py')
          text = path.read_text()
          text = text.replace(
              "'''  return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals };'''",
              "'''return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals };'''",
          ).replace(
              "'''  return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals, operationalMeals: foundOperationalMeals };'''",
              "'''return { outcome, tasks: found, preparations: foundPreparations, roundPreparations: foundRoundPreparations, selectionOrder: foundOrder, participantMeals: foundParticipantMeals, operationalMeals: foundOperationalMeals };'''",
          )
          path.write_text(text)
          PY
          python .github/tmp-scoped-operational-meal.py
          python - <<'PY'
          from pathlib import Path
          path = Path('engine/planner-next/flexibleOperationalMealPolicy.spec.ts')
          text = path.read_text()
          text = text.replace(
            'import { createSupportedEngineInputAdapterFixture } from "./integration/engineInputAdapter.fixture";',
            'import { createSpec10020FlexibleSetupOrderEngineInputFixture } from "./integration/engineInputAdapter.fixture";',
            1,
          ).replace(
            'const input = createSupportedEngineInputAdapterFixture();',
            'const input = createSpec10020FlexibleSetupOrderEngineInputFixture();',
            1,
          )
          old = '''  adapted.problem!.searchPolicy = "EXACT_CONSTRUCTIVE";\n  adapted.problem!.budget.maxBranchExpansions = Math.max(adapted.problem!.budget.maxBranchExpansions, 300000);\n  const execution = executePlannerNext(adapted.problem!);'''
          new = '''  const exactProblem = structuredClone(adapted.problem!);\n  exactProblem.searchPolicy = "EXACT_CONSTRUCTIVE";\n  exactProblem.budget.maxBranchExpansions = Math.max(exactProblem.budget.maxBranchExpansions, 300000);\n  const execution = executePlannerNext(exactProblem);'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one mutable adapted-problem test block, found {text.count(old)}')
          text = text.replace(old, new, 1).replace('validatePlan(adapted.problem!, result.scheduledTasks', 'validatePlan(exactProblem, result.scheduledTasks', 1)
          text = text.replace('assert.equal(execution.result?.complete, true);', 'assert.equal(execution.result?.complete, true, JSON.stringify(execution.result?.evidence));', 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Focal tests
        run: npx tsx --test engine/planner-next/flexibleOperationalMealPolicy.spec.ts engine/planner-next/spaceMeals.spec.ts
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/tmp-scoped-operational-meal.py .github/workflows/tmp-scoped-operational-meal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement scoped operational meal exclusivity'
          git push origin HEAD:optiplan/scoped-operational-meal-exclusivity
