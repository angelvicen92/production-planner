name: SPEC11-010 checkpoint 3 merge gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.ref == 'spec11-010-checkpoint3-buildinput-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: spec11-010-checkpoint3-buildinput-snapshot

      - name: Verify exact PR head and clean tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet
          git diff --cached --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure automation identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply reviewed checkpoint delta
        run: node scripts/apply-spec11-010-checkpoint3-v3.cjs

      - name: Focal snapshot and buildInput validation
        run: >-
          npx tsx --test
          server/planOptimizerSnapshot.spec.ts
          server/planOptimizerSnapshotPersistence.spec.ts
          server/planOptimizerSnapshotIntegration.spec.ts
          engine/planOptimizerSnapshotLegacyAdapter.spec.ts
          engine/buildInput.optimizerSnapshot.spec.ts
          engine/buildInput.taskTemplateSnapshot.spec.ts
          engine/buildInput.sourceCriticality.spec.ts

      - name: Migration sequence
        run: npm run check:migrations

      - name: TypeScript
        run: npm run check

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Quick engine regression benchmark
        run: npm run benchmark:engine:quick

      - name: Diff hygiene
        run: git diff --check

      - name: Publish clean candidate and remove bootstrap artifacts
        run: |
          git add \
            README.md \
            engine/buildInput.ts \
            engine/types.ts \
            engine/buildInput.taskTemplateSnapshot.spec.ts \
            engine/buildInput.sourceCriticality.spec.ts \
            server/taskTemplateSnapshot.ts \
            server/storage.ts \
            server/planOptimizerSnapshotIntegration.spec.ts
          git rm --ignore-unmatch \
            .github/workflows/spec11-010-checkpoint3-merge-gate.yml \
            scripts/apply-spec11-010-checkpoint3.cjs \
            scripts/apply-spec11-010-checkpoint3-v2.cjs \
            scripts/apply-spec11-010-checkpoint3-v3.cjs
          git diff --cached --check
          test -z "$(git status --porcelain | grep '^??' || true)"
          git commit -m "SPEC11-010: consume daily optimizer snapshot in buildInput"
          git push origin HEAD:spec11-010-checkpoint3-buildinput-snapshot
