name: Planner Engine CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/**"
      - "docs/source/**"
      - "docs/evidence/**"
      - "docs/coverage/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/planner-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-engine-ci:
    name: planner-engine-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Full A2 benchmark first run
        run: |
          npm run benchmark:planner-next:a2-full-template > /tmp/full-a2-first.txt
          cp docs/evidence/SPEC10-016-full-a2-canonical-template.json /tmp/SPEC10-016-full-a2-first.json
          cp docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md /tmp/SPEC10-016-full-a2-first.md

      - name: Full A2 benchmark second run
        run: npm run benchmark:planner-next:a2-full-template > /tmp/full-a2-second.txt

      - name: Verify deterministic benchmark and generated artifacts
        run: |
          cmp /tmp/full-a2-first.txt /tmp/full-a2-second.txt
          cmp /tmp/SPEC10-016-full-a2-first.json docs/evidence/SPEC10-016-full-a2-canonical-template.json
          cmp /tmp/SPEC10-016-full-a2-first.md docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md

      - name: Verify generated Evidence is current
        run: git diff --exit-code

      - name: Diff hygiene
        run: git diff --check

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

  a2-full-exec-001-causal:
    name: a2-full-exec-001-causal
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run A2-FULL-EXEC-001 once
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/evidence/A2-FULL-EXEC-001-first-execution.json
          npx tsx engine/planner-next/benchmarks/runFullA2FirstExecutionBenchmark.ts | tee /tmp/a2-full-exec-001.txt

      - name: Print causal metrics
        if: always()
        run: |
          if [ ! -f docs/evidence/A2-FULL-EXEC-001-first-execution.json ]; then
            echo "No fresh A2-FULL-EXEC-001 Evidence was generated."
            exit 0
          fi
          node <<'NODE'
          const j = require('./docs/evidence/A2-FULL-EXEC-001-first-execution.json');
          const x = j.execution ?? {};
          const e = x.evidence ?? {};
          console.log(JSON.stringify({
            status: x.status,
            complete: x.complete,
            branchesExplored: e.branchesExplored,
            coreBranches: e.coreBranches,
            standaloneBranches: e.standaloneBranches,
            standaloneTaskSelections: e.standaloneTaskSelections,
            standaloneBacktracks: e.standaloneBacktracks,
            standaloneMaximumDepth: e.standaloneMaximumDepth,
            standaloneCompleteLeafCount: e.standaloneCompleteLeafCount,
            participantMealBranchesExplored: e.participantMealBranchesExplored,
            participantMealFutureFeasibilityChecks: e.participantMealFutureFeasibilityChecks,
            participantMealFutureInfeasibleBranches: e.participantMealFutureInfeasibleBranches,
            participantMealCheapProbes: e.participantMealCheapProbes,
            participantMealAffectedObligationsChecked: e.participantMealAffectedObligationsChecked,
            participantMealAnalyticDomainBuilds: e.participantMealAnalyticDomainBuilds,
            participantMealLogicalGridStarts: e.participantMealLogicalGridStarts,
            participantMealAnalyticallyEliminatedStarts: e.participantMealAnalyticallyEliminatedStarts,
            participantMealActuallyEvaluatedStarts: e.participantMealActuallyEvaluatedStarts,
            participantMealZeroDomainPrunes: e.participantMealZeroDomainPrunes,
            participantMealAnalyticCollectivePrunes: e.participantMealAnalyticCollectivePrunes,
            participantMealExactSearchesAvoided: e.participantMealExactSearchesAvoided,
            participantMealExactMaterializations: e.participantMealExactMaterializations,
            lastExhaustionPhase: e.lastExhaustionPhase,
            causalDiagnostic: e.causalDiagnostic ?? null
          }, null, 2));
          NODE

      - name: Upload fresh A2-FULL-EXEC-001 Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-full-exec-001-${{ github.sha }}
          path: |
            docs/evidence/A2-FULL-EXEC-001-first-execution.json
            /tmp/a2-full-exec-001.txt
          if-no-files-found: warn
          retention-days: 7
