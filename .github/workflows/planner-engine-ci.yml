name: Planner Engine CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/**"
      - "docs/source/**"
      - "docs/evidence/**"
      - "docs/coverage/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/planner-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planner-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-evidence:
    name: refresh-full-a2-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: optiplan/scoped-operational-meal-exclusivity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical Full A2 Evidence
        run: npm run benchmark:planner-next:a2-full-template

      - name: Restore CI workflow and remove temporary one-shot workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/planner-engine-ci.yml
          rm -f .github/workflows/tmp-regenerate-full-a2-evidence.yml
          git add .github/workflows/planner-engine-ci.yml .github/workflows/tmp-regenerate-full-a2-evidence.yml docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md docs/evidence/SPEC10-016-full-a2-canonical-template.json
          git diff --cached --check

      - name: Commit refreshed Evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No staged delta to commit"; exit 1; }
          git commit -m "Refresh Full A2 generated Evidence"
          git push origin HEAD:optiplan/scoped-operational-meal-exclusivity
