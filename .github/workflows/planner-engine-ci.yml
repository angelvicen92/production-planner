name: Planner Engine CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/**"
      - "server/**"
      - "script/demo/**"
      - "supabase/migrations/**"
      - "client/src/components/day-workspace/**"
      - "client/src/components/planning/planning-workspace-layout.tsx"
      - "client/src/components/planning/planning-stage-toolbar.tsx"
      - "client/src/lib/day-execution-view*"
      - "client/src/lib/planning-workspace-preferences*"
      - "client/src/hooks/use-plan-staff.ts"
      - "client/src/hooks/use-user-role.ts"
      - "client/src/hooks/use-auth.tsx"
      - "client/src/hooks/use-tasks.ts"
      - "client/src/components/add-task-dialog.tsx"
      - "client/src/index.css"
      - "client/index.html"
      - "client/public/fonts/**"
      - "client/src/components/layout.tsx"
      - "client/src/components/planning/assisted-planning-workspace.tsx"
      - "client/src/components/planning/assisted-autopilot-progress*"
      - "client/src/components/planning/stage-history-timing.tsx"
      - "client/src/components/planning-timeline.tsx"
      - "client/src/pages/plan-details.tsx"
      - "client/src/lib/contestant-lane-sort*"
      - "client/src/lib/planning-view-policy*"
      - "shared/assistedStageTiming*"
      - "client/src/lib/assisted-draft-warnings*"
      - "client/src/lib/assisted-validation-messages*"
      - "client/src/lib/assisted-planning-view*"
      - "client/src/lib/assisted-autopilot*"
      - "client/src/lib/assisted-scope-selection*"
      - "client/src/components/planning/assisted-location-scope*"
      - "shared/mainFlowPreference*"
      - "shared/transportPolicy*"
      - "shared/dayConfig*"
      - "client/src/components/transport-settings-card.tsx"
      - "client/src/components/transport-policy-fields.tsx"
      - "client/src/components/effective-configuration.tsx"
      - "client/src/components/general-program-settings.tsx"
      - "client/src/components/main-flow-preference-editor.tsx"
      - "client/src/lib/main-flow-preference-result.ts"
      - "shared/assistedAutopilot*"
      - "shared/assistedStageValidation*"
      - "docs/source/**"
      - "docs/evidence/**"
      - "docs/coverage/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/planner-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-draft-validation:
    name: manual-draft-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install tsc -p script/demo/tsconfig.integration.json
      - run: node --import tsx --test --test-concurrency=1 engine/planner-next/transportGrouping.spec.ts engine/planner-next/transportConfigIntegrity.spec.ts server/transportConfigIntegrity.spec.ts server/assistedManualSnapshotFidelity.spec.ts server/assistedStageAcceptanceAuthorization.spec.ts shared/assistedStageValidation.test.ts client/src/lib/assisted-draft-warnings.test.ts client/src/components/planning/assisted-planning-workspace.test.ts
      - run: npm run demo:a2:smoke -- work/manual-draft-validation --full --manual-validation --transport-policy
      - name: Production REQUIRED acceptance in a separate immutable day fixture
        run: npm run demo:a2:smoke -- work/manual-required --manual-required-replay=work/manual-draft-validation/manual-validation-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-draft-validation
          path: |
            work/manual-draft-validation/integration.json
            work/manual-draft-validation/manual-validation-probe.json
            work/manual-draft-validation/p9-*.png
            work/manual-draft-validation/transport-policy.json
            work/manual-draft-validation/p10-*.png
            work/manual-required/integration.json
            work/manual-required/required-acceptance.json
            work/manual-required/p9-*.png
  autopilot-workspace:
    name: autopilot-workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install tsc -p script/demo/tsconfig.integration.json
      - name: Role policy regression (browser, controller and intercepted HTTP)
        run: node --import tsx script/demo/userRolePolicy.browser.mjs
      - run: node --import tsx --test client/src/lib/assisted-autopilot-checkpoints.test.ts client/src/lib/assisted-autopilot-progress.test.ts client/src/components/planning/assisted-autopilot-progress.test.tsx
      - run: npm run demo:a2:smoke -- work/autopilot-workspace --historical-topology --autopilot-workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopilot-workspace
          path: |
            work/autopilot-workspace/integration.json
            work/autopilot-workspace/autopilot-workspace.json
            work/autopilot-workspace/autopilot-workspace-*.png
            work/p6-role-policy/policy.json
  a2-assisted-catalog-integration:
    name: a2-assisted-catalog-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install tsc -p script/demo/tsconfig.integration.json
      - run: npm run test:demo:a2-import
      - run: node --import tsx --test script/demo/a2ConfigurationReadRecovery.spec.ts server/effectiveConfigurationHttp.spec.ts
      - run: node --import tsx --test script/demo/a2RealTopology.spec.ts script/demo/a2RealImportSQL.spec.ts script/demo/a2OperationScope.spec.ts shared/anchoredOperationProjection.test.ts shared/taskOperationScope.test.ts
      - run: node --import tsx --test script/demo/a2DraftPreparationRecovery.spec.ts
      - run: npx --no-install tsx --test shared/assistedAutopilot.test.ts shared/assistedStageTiming.test.ts client/src/components/planning/assisted-planning-workspace.test.ts client/src/components/planning/stage-history-timing.test.ts client/src/lib/assisted-draft-warnings.test.ts client/src/lib/assisted-planning-view.test.ts client/src/lib/contestant-lane-sort.test.ts client/src/lib/planning-view-policy.test.ts server/assistedHistoryTimings.spec.ts client/src/lib/assisted-scope-selection.test.ts client/src/components/planning/assisted-location-scope.test.tsx
      - run: node --import tsx --test client/src/lib/day-execution-view.test.ts client/src/lib/planning-workspace-preferences.test.ts client/src/components/effective-configuration.test.tsx
      - name: Day workspace setup through real UI and existing writers
        run: npm run demo:a2:smoke -- work/day-workspace-setup --workspace-setup
      - name: Assisted location selection in a disposable A2 catalog
        run: npm run demo:a2:smoke -- work/a2-scope-integration --scope-selection
      - name: Configuration read with the observed 52 legacy breaks and S0 Autopilot
        run: npm run demo:a2:smoke -- work/a2-config-read-recovery --historical-topology --configuration-read-recovery
      - name: Integration evidence (no private app logs or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-assisted-catalog-integration
          path: |
            work/day-workspace-setup/integration.json
            work/day-workspace-setup/day-workspace-setup.json
            work/day-workspace-setup/workspace-*.png
            work/a2-scope-integration/integration.json
            work/a2-scope-integration/scope-selection-*.json
            work/a2-config-read-recovery/integration.json
            work/a2-config-read-recovery/configuration-read-run.json
            work/a2-config-read-recovery/configuration-read-controller.json
            work/a2-config-read-recovery/configuration-read-http-failure.json

  # Independent disposable fixtures: keep every assertion and the 30-minute
  # limit, without charging catalog/UI rehearsals to the canonical run's clock.
  a2-assisted-canonical-integration:
    name: a2-assisted-canonical-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install tsc -p script/demo/tsconfig.integration.json
      - name: Native SQL, Auth, HTTP and UI; canonical baseline and two deterministic orders
        run: npm run demo:a2:smoke -- work/a2-integration --historical-topology --full --day-workspace --stage-order --autopilot --reality-scope
      - name: Integration evidence (no private app logs or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-assisted-integration
          path: |
            work/a2-integration/integration.json
            work/a2-integration/stage-order.json
            work/a2-integration/autopilot.json
            work/a2-integration/views-history.json
            work/a2-integration/day-workspace.json
            work/a2-integration/workspace-*.png
            work/a2-integration/manual-snapshot-fidelity.json
            work/a2-integration/restart.json
            work/a2-integration/*-real-ui.png
            work/a2-integration/reality-scope.json
            work/a2-integration/reality-*.png

  # Preserve the existing required check as the conjunction of both rehearsals.
  a2-assisted-integration:
    name: a2-assisted-integration
    needs: [a2-assisted-catalog-integration, a2-assisted-canonical-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both complete native rehearsals
        env:
          P10_CATALOG_RESULT: ${{ needs.a2-assisted-catalog-integration.result }}
          P10_CANONICAL_RESULT: ${{ needs.a2-assisted-canonical-integration.result }}
        run: |
          test "$P10_CATALOG_RESULT" = success
          test "$P10_CANONICAL_RESULT" = success

  main-flow-preference-integration:
    name: main-flow-preference-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install tsc -p script/demo/tsconfig.integration.json
      - name: Real settings, day configuration, Evidence, Draft and Stages
        run: npm run demo:a2:smoke -- work/main-flow-preference-integration --historical-topology --full --day-workspace --main-flow-preference
      - name: Preference evidence from disposable services
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-flow-preference-integration
          path: |
            work/main-flow-preference-integration/integration.json
            work/main-flow-preference-integration/main-flow-preference-S1-result.json
            work/main-flow-preference-integration/*-real-ui.png
            work/main-flow-preference-integration/day-workspace.json
            work/main-flow-preference-integration/workspace-*.png

  planner-engine-ci:
    name: planner-engine-ci
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Product test suite
        shell: bash
        run: |
          set -euo pipefail
          # ASST-010 single-task continuation is a known blocked historical
          # diagnostic, outside the certified eleven-stage A2 product flow.
          # Retain its assertion unchanged and run it explicitly on dispatch.
          mapfile -t test_files < <(node script/run-test-suite.mjs --list engine server | grep -v -E '^(engine/planner-next/benchmarks/runFullA2FirstExecutionBenchmark.spec.ts|server/benchmarks/runA2Assist7Evidence.spec.ts)$')
          if (( ${#test_files[@]} == 0 )); then
            echo "No product test files discovered" >&2
            exit 1
          fi
          npx --no-install tsx --test "${test_files[@]}"

      - name: Main-flow SOFT count cold-fallback diagnostic (isolated checkout)
        run: |
          # Pin the authorized diagnostic base, independently from newer main/template changes.
          git fetch --no-tags --depth=1 origin 20e4b30fbccde3615602fffadcf5f5e9a136c705
          node --import tsx script/demo/mainFlowSoftBlockDiagnostic.ts --cold-only

      - name: Main future-dependency bound on the current candidate
        run: node --import tsx script/demo/mainFlowSoftBlockDiagnostic.ts work/main-future-dependency-candidate --cold-only --candidate

      - name: Historical ASST-010 single-task continuation diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npx --no-install tsx --test server/benchmarks/runA2Assist7Evidence.spec.ts

      - name: Full A2 Autopilot structural frontier diagnostic
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          npx --no-install tsx --test engine/planner-next/benchmarks/runFullA2FirstExecutionBenchmark.spec.ts 2>&1 | tee "$test_log"
          npx --no-install tsx engine/planner-next/benchmarks/checkFullA2StructuralFrontier.ts "$test_log"

      - name: SPEC10-016 canonical template benchmark first run
        run: |
          npm run benchmark:planner-next:a2-full-template > /tmp/full-a2-first.txt
          cp docs/evidence/SPEC10-016-full-a2-canonical-template.json /tmp/SPEC10-016-full-a2-first.json
          cp docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md /tmp/SPEC10-016-full-a2-first.md

      - name: SPEC10-016 canonical template benchmark second run
        run: npm run benchmark:planner-next:a2-full-template > /tmp/full-a2-second.txt

      - name: Verify deterministic benchmark and generated artifacts
        run: |
          cmp /tmp/full-a2-first.txt /tmp/full-a2-second.txt
          cmp /tmp/SPEC10-016-full-a2-first.json docs/evidence/SPEC10-016-full-a2-canonical-template.json
          cmp /tmp/SPEC10-016-full-a2-first.md docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md

      - name: Verify generated Evidence is current
        run: git diff --exit-code

      - name: Diff hygiene
        run: git diff --check

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build
