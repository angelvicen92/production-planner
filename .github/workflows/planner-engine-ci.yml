name: Planner Engine CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/**"
      - "docs/source/**"
      - "docs/evidence/**"
      - "docs/coverage/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/planner-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-engine-ci:
    name: planner-engine-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm test

      - name: Full A2 benchmark first run
        run: |
          npm run benchmark:planner-next:a2-full-template > /tmp/full-a2-first.txt
          cp docs/evidence/A2-FULL-001-full-a2-representability.json /tmp/A2-FULL-001-first.json
          cp docs/evidence/A2-FULL-010-transport-policy-representability.json /tmp/A2-FULL-010-first.json

      - name: Full A2 benchmark second run
        run: npm run benchmark:planner-next:a2-full-template > /tmp/full-a2-second.txt

      - name: Verify deterministic benchmark and Evidence
        run: |
          cmp /tmp/full-a2-first.txt /tmp/full-a2-second.txt
          cmp /tmp/A2-FULL-001-first.json docs/evidence/A2-FULL-001-full-a2-representability.json
          cmp /tmp/A2-FULL-010-first.json docs/evidence/A2-FULL-010-transport-policy-representability.json

      - name: Verify generated Evidence is current
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const paths = [
            'docs/evidence/A2-FULL-001-full-a2-representability.json',
            'docs/evidence/A2-FULL-010-transport-policy-representability.json',
          ];

          const normalize = (value) => {
            const copy = structuredClone(value);
            if (copy.repository) {
              delete copy.repository.codeSha;
              delete copy.repository.branch;
              delete copy.repository.head;
            }
            return copy;
          };

          for (const path of paths) {
            const committed = JSON.parse(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }));
            const generated = JSON.parse(fs.readFileSync(path, 'utf8'));
            assert.deepStrictEqual(
              normalize(generated),
              normalize(committed),
              `${path} differs from committed Evidence beyond repository provenance`,
            );
          }
          NODE
          git restore -- \
            docs/evidence/A2-FULL-001-full-a2-representability.json \
            docs/evidence/A2-FULL-010-transport-policy-representability.json
          git diff --exit-code

      - name: Diff hygiene
        run: git diff --check

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build
