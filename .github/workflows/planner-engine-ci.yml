name: Planner Engine CI

on:
  push:
    branches:
      - optiplan/full-a2-first-execution
    paths:
      - ".github/workflows/planner-engine-ci.yml"

permissions:
  contents: write

jobs:
  full-a2-first-execution:
    name: full-a2-first-execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: optiplan/full-a2-first-execution
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Full A2 first execution benchmark
        run: npx tsx engine/planner-next/benchmarks/runFullA2FirstExecutionBenchmark.ts
      - name: TypeScript check
        run: npm run check
      - name: Restore canonical CI and commit Evidence
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/planner-engine-ci.yml
          git add .github/workflows/planner-engine-ci.yml docs/evidence/A2-FULL-EXEC-001-first-execution.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record first Full A2 execution Evidence"
          git push origin HEAD:optiplan/full-a2-first-execution
