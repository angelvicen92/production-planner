name: Regenerate Full A2 Evidence

on:
  push:
    branches:
      - optiplan/scoped-operational-meal-exclusivity
    paths:
      - .github/workflows/tmp-regenerate-full-a2-evidence.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: optiplan/scoped-operational-meal-exclusivity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical Full A2 Evidence
        run: npm run benchmark:planner-next:full-a2

      - name: Remove temporary workflow and validate diff
        run: |
          rm .github/workflows/tmp-regenerate-full-a2-evidence.yml
          git add docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md docs/evidence/SPEC10-016-full-a2-canonical-template.json .github/workflows/tmp-regenerate-full-a2-evidence.yml
          git diff --cached --check
          git diff --cached --exit-code >/dev/null && { echo "Expected generated Evidence delta is empty"; exit 1; } || true

      - name: Commit regenerated Evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Full A2 representability Evidence"
          git push origin HEAD:optiplan/scoped-operational-meal-exclusivity
