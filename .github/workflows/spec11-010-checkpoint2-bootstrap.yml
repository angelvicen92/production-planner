name: SPEC11-010 checkpoint 2 merge gate

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: github.event.pull_request.head.ref == 'spec11-010-checkpoint2-optimizer-snapshot-db'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: spec11-010-checkpoint2-optimizer-snapshot-db

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet
          git diff --cached --quiet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure automation identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make daily task-template references non-destructive
        run: |
          migration='supabase/migrations/075_plan_optimizer_snapshots.sql'
          arrival='arrival_plan_template_snapshot_id BIGINT REFERENCES public.plan_task_template_snapshots(id) ON DELETE CASCADE,'
          departure='departure_plan_template_snapshot_id BIGINT REFERENCES public.plan_task_template_snapshots(id) ON DELETE CASCADE,'
          test "$(grep -F -c "$arrival" "$migration")" = "1"
          test "$(grep -F -c "$departure" "$migration")" = "1"
          sed -i \
            -e 's/arrival_plan_template_snapshot_id BIGINT REFERENCES public\.plan_task_template_snapshots(id) ON DELETE CASCADE,/arrival_plan_template_snapshot_id BIGINT REFERENCES public.plan_task_template_snapshots(id),/' \
            -e 's/departure_plan_template_snapshot_id BIGINT REFERENCES public\.plan_task_template_snapshots(id) ON DELETE CASCADE,/departure_plan_template_snapshot_id BIGINT REFERENCES public.plan_task_template_snapshots(id),/' \
            "$migration"
          test "$(grep -F -c 'REFERENCES public.plan_task_template_snapshots(id) ON DELETE CASCADE' "$migration" || true)" = "0"

      - name: Focal validation
        run: npx tsx --test server/planOptimizerSnapshot.spec.ts server/planOptimizerSnapshotPersistence.spec.ts server/planOptimizerSnapshotMigration.spec.ts server/planOptimizerSnapshotIntegration.spec.ts

      - name: Migration sequence
        run: npm run check:migrations

      - name: TypeScript
        run: npm run check

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Remove temporary merge-gate workflow and publish candidate
        run: |
          git rm .github/workflows/spec11-010-checkpoint2-bootstrap.yml
          git add supabase/migrations/075_plan_optimizer_snapshots.sql
          git diff --cached --check
          git commit -m "SPEC11-010: finalize optimizer snapshot checkpoint 2"
          git push origin HEAD:spec11-010-checkpoint2-optimizer-snapshot-db
