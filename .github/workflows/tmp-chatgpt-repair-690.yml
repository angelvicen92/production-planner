name: Temporary ChatGPT transport repair

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guard diagnostic-only commits
        id: guard
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: capture transport test failure" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Apply focused repair and diagnostics
        if: steps.guard.outputs.skip != 'true'
        run: |
          python .github/tmp-repair-690.py
          python .github/tmp-preferred-end-690.py
          python .github/tmp-transport-fixture-690.py
          python .github/tmp-diagnose-690.py

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Focal transport tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          npx tsx --test engine/planner-next/transportGrouping.spec.ts engine/planner-next/flexibleSetupOrder.spec.ts 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            cp /tmp/test.log .chatgpt-690-test.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f .chatgpt-690-test.log
            git commit -m 'chore: capture transport test failure'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
            exit "$code"
          fi

      - name: Full test suite
        if: steps.guard.outputs.skip != 'true'
        run: npm test

      - name: TypeScript check
        if: steps.guard.outputs.skip != 'true'
        run: npm run check

      - name: Full A2 representability benchmark
        if: steps.guard.outputs.skip != 'true'
        run: npm run benchmark:planner-next:a2-full-template

      - name: Commit validated repair and remove temporary harness
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm -f .github/workflows/tmp-chatgpt-repair-690.yml .github/tmp-repair-690.py .github/tmp-preferred-end-690.py .github/tmp-transport-fixture-690.py .github/tmp-diagnose-690.py .chatgpt-690-test.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A engine/planner-next/exactMainAndFeederCore.ts engine/planner-next/flexibleSetupOrder.spec.ts engine/planner-next/transportGrouping.spec.ts engine/planner-next/validate.ts docs/evidence/SPEC10-016-full-a2-canonical-template.json docs/coverage/SPEC10-016-FULL-A2-TEMPLATE.md .github/workflows/tmp-chatgpt-repair-690.yml .github/tmp-repair-690.py .github/tmp-preferred-end-690.py .github/tmp-transport-fixture-690.py .github/tmp-diagnose-690.py .chatgpt-690-test.log
          git diff --cached --check
          git commit -m 'Fix transport continuation around hard departure bounds'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
