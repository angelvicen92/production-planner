name: P0 U00z native operational pauses
on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'server/**'
      - 'shared/**'
      - 'client/src/**'
      - 'supabase/migrations/**'
      - 'script/demo/**'
      - 'docs/evidence/p0-u00z/**'
      - '.github/workflows/p0-u00z-native-operational-meals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-operational-meals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Select Chromium
        run: |
          task_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_browser_path" ]; then
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$task_browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run check && npm run check:migrations && npm run build
      - run: npx --no-install tsc -p docs/evidence/p0-u00z/tsconfig.json
      - run: node --import tsx --test --test-concurrency=1 engine/planner-next/integration/nativeOperationalMeals.spec.ts engine/planner-next/integration/nativeJointGroups.spec.ts engine/planner-next/jointTasks.spec.ts engine/planner-next/integration/nativeRealityComposition.spec.ts script/demo/assistedSQLContracts.spec.ts script/demo/a2Preflight.spec.ts
      - run: node --import tsx docs/evidence/p0-u00z/upgrade121.ts work/u00z-upgrade
      - run: node --import tsx docs/evidence/p0-u00z/run.ts work/u00z-native --native
      - run: node --import tsx docs/evidence/p0-u00z/run.ts work/u00z-repeat --native --public-negatives
      - run: node --import tsx docs/evidence/p0-u00z/verify.ts work/u00z-native work/u00z-repeat work/u00z-determinism.json
      - run: node --import tsx docs/evidence/p0-u00z/physical.ts work/u00z-native work/u00z-physical.json
      - run: node --import tsx docs/evidence/p0-u00z/run.ts work/u00z-joint --joint-integration
      - run: node --import tsx docs/evidence/p0-u00z/run.ts work/u00z-individual --individual-diagnostic --individual-success
      - run: node --import tsx docs/evidence/p0-u00z/run.ts work/u00z-individual-repeat --individual-diagnostic --individual-success --public-negatives
      - run: node --import tsx docs/evidence/p0-u00z/verify.ts work/u00z-individual work/u00z-individual-repeat work/u00z-individual-determinism.json --individual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u00z-native-operational-meals
          path: |
            work/u00z-upgrade/manifest.json
            work/u00z-upgrade/native/*.json
            work/u00z-upgrade/native/*.json.gz
            work/u00z-native/manifest.json
            work/u00z-native/checkout-delta.json
            work/u00z-native/native/*.json
            work/u00z-native/native/*.png
            work/u00z-repeat/manifest.json
            work/u00z-repeat/native/*.json
            work/u00z-physical.json
            work/u00z-joint/manifest.json
            work/u00z-joint/joint-native-dispatch.json
            work/u00z-joint/native/*.json
            work/u00z-joint/native/*.png
            work/u00z-determinism.json
            work/u00z-individual/manifest.json
            work/u00z-individual/native/*.json
            work/u00z-individual-repeat/manifest.json
            work/u00z-individual-repeat/native/*.json
            work/u00z-individual-determinism.json
          retention-days: 14
