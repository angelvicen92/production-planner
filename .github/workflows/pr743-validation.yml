name: PR 743 Candidate Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Technical chain and exact standalone tests
        run: npx tsx --test engine/planner-next/technicalChains.spec.ts engine/planner-next/exactItinerantPlan.spec.ts
      - name: Technical chain benchmark
        run: npx tsx engine/planner-next/benchmarks/runPlannerNextTechnicalChainBenchmark.ts > /tmp/technical-chain.json
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr743-focal
          path: /tmp/technical-chain.json

  full-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Full A2 exact execution once
        run: node --import tsx engine/planner-next/benchmarks/runFullA2FirstExecutionBenchmark.ts | tee /tmp/full-a2.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr743-full-a2
          path: |
            /tmp/full-a2.txt
            docs/evidence/A2-FULL-EXEC-001-first-execution.json
