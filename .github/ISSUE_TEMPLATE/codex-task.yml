name: Codex task
description: Define one OptiPlan implementation delta for Codex.
title: "[CODEX] "
body:
  - type: markdown
    attributes:
      value: |
        One logical unit only. Codex reads AGENTS.md first; do not repeat permanent context here.

  - type: dropdown
    id: change_type
    attributes:
      label: Change classification
      options:
        - Fast Merge
        - DB Safe Merge
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One observable result.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Demonstrated defect or evidence
      description: Point to the failing behavior, test, Evidence artifact or PR finding. Keep excerpts minimal.
    validations:
      required: true

  - type: textarea
    id: read_set
    attributes:
      label: Read
      description: List only the files, symbols, tests and official sections needed for this delta.
    validations:
      required: true

  - type: textarea
    id: delta
    attributes:
      label: Change
      description: State the exact implementation delta; do not restate project-wide rules.
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: Do not touch
      description: Only task-specific exclusions not already covered by AGENTS.md.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Accept when
      description: List only observable acceptance criteria for this delta.
    validations:
      required: true

  - type: textarea
    id: validation_now
    attributes:
      label: Validate now
      description: TypeScript/lint, focal tests or causal benchmark required during implementation.
    validations:
      required: true

  - type: textarea
    id: merge_gate
    attributes:
      label: Final gate
      description: Full validation required only on the candidate head; write N/A when not applicable.
    validations:
      required: true
